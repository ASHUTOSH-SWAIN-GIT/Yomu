<!doctype html><meta charset="utf-8" /><style>
  html,
  body {
    margin: 0;
    background: transparent;
  }
</style>
<!-- Yomu app icon: a book opened wide and seen end-on. Its two halves make
     the arms of a Y and the bookmark ribbon hanging from the spine is the
     stem. Rendered to yomu-1024.png with headless Chrome, then
     `npx tauri icon`. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow
        dx="0"
        dy="14"
        stdDeviation="18"
        flood-color="#000"
        flood-opacity=".35"
      />
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="16"
        stdDeviation="16"
        flood-color="#000"
        flood-opacity=".45"
      />
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26272f" />
      <stop offset="1" stop-color="#121318" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a4c" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ff8a4c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pageL" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9ccb0" />
      <stop offset="0.35" stop-color="#fbf6ea" />
      <stop offset="1" stop-color="#fffdf7" />
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc0a0" />
      <stop offset="0.35" stop-color="#f3ecdc" />
      <stop offset="1" stop-color="#fbf6ea" />
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a3d" />
      <stop offset="1" stop-color="#d9431a" />
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5501f" />
      <stop offset="0.5" stop-color="#ff7a3d" />
      <stop offset="1" stop-color="#c63a14" />
    </linearGradient>
    <!-- one half of the open book: page block with its cover underneath -->
    <g id="half">
      <path
        d="M512 600 C478 512 410 420 286 330 L250 384 C368 466 440 552 476 640 Z"
        fill="url(#cover)"
      />
      <path
        d="M512 576 C478 490 410 398 292 312 L262 356 C376 440 446 526 482 614 Z"
      />
    </g>
  </defs>

  <rect
    x="100"
    y="100"
    width="824"
    height="824"
    rx="186"
    fill="url(#bg)"
    filter="url(#sh)"
  />
  <circle cx="512" cy="470" r="330" fill="url(#glow)" />

  <!-- ribbon (the stem), coming out of the spine -->
  <path
    d="M482 560 H542 V820 L512 786 L482 820 Z"
    fill="url(#ribbon)"
    filter="url(#soft)"
  />
  <path d="M482 560 H496 V804 L482 820 Z" fill="#fff" opacity="0.15" />

  <!-- the two halves (the arms) -->
  <g filter="url(#soft)">
    <use href="#half" fill="url(#pageL)" />
    <use href="#half" fill="url(#pageR)" transform="matrix(-1 0 0 1 1024 0)" />
  </g>
  <!-- page edges -->
  <g
    fill="none"
    stroke="#b6a581"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.7"
  >
    <path d="M500 586 C468 502 402 412 284 326" />
    <path d="M492 598 C460 514 394 426 276 340" />
    <path d="M486 608 C452 526 386 438 270 350" />
    <path d="M524 586 C556 502 622 412 740 326" />
    <path d="M532 598 C564 514 630 426 748 340" />
    <path d="M538 608 C572 526 638 438 754 350" />
  </g>
  <!-- light on the top page of each half -->
  <path
    d="M506 570 C474 488 408 398 292 314"
    stroke="#fff"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
    opacity="0.9"
  />
  <path
    d="M518 570 C550 488 616 398 732 314"
    stroke="#fff"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
    opacity="0.55"
  />
</svg>
