<!doctype html><meta charset="utf-8" /><style>
  html,
  body {
    margin: 0;
    background: transparent;
  }
</style>
<!-- Yomu app icon: 読 ("to read") on ink, with the space-colour underline that
     marks an annotated passage. macOS style: a squircle inside the 1024 canvas. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow
        dx="0"
        dy="14"
        stdDeviation="18"
        flood-color="#000"
        flood-opacity=".35"
      />
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252d" />
      <stop offset="1" stop-color="#14151a" />
    </linearGradient>
  </defs>
  <rect
    x="100"
    y="100"
    width="824"
    height="824"
    rx="186"
    fill="url(#bg)"
    filter="url(#sh)"
  />
  <rect
    x="101"
    y="101"
    width="822"
    height="822"
    rx="185"
    fill="none"
    stroke="#ffffff"
    stroke-opacity=".08"
    stroke-width="2"
  />
  <text
    x="512"
    y="662"
    text-anchor="middle"
    font-family="'Hiragino Mincho ProN','Hiragino Mincho Pro','Yu Mincho','Noto Serif CJK JP',serif"
    font-weight="700"
    font-size="470"
    fill="#f5f5f7"
  >
    読
  </text>
  <rect x="316" y="712" width="392" height="30" rx="15" fill="#e0561f" />
</svg>
