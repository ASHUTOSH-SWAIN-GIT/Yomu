name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  rust:
    name: Rust (fmt, clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      # Node is needed to run the ACP spike test (agent/tests.rs), which
      # spawns scripts/mock-acp-agent.mjs — there's no real Codex install
      # to test against in CI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # The sandbox tests start real processes under the Linux rules. They
      # skip on a kernel without Landlock, so here a skip is a failure: this
      # step proves the sandbox really ran on the CI machine.
      - name: Linux sandbox (Landlock) tests
        working-directory: src-tauri
        env:
          YOMU_REQUIRE_LANDLOCK: "1"
        run: cargo test agent::confine -- --nocapture

  rust-macos:
    name: Rust (macOS sandbox)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The mock agent (scripts/mock-acp-agent.mjs) runs on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Real processes under the real `sandbox-exec` profile (agent/sandbox.rs),
      # plus the agent tests against the mock agent.
      - name: cargo test (agent and sandbox)
        working-directory: src-tauri
        run: "cargo test --lib agent::"

  rust-windows:
    name: Rust (Windows builds)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The release builds Windows installers, so Windows must compile on every
      # change, not only on release day. It only compiles: Tauri's unit-test
      # programs cannot start on a Windows runner (STATUS_ENTRYPOINT_NOT_FOUND,
      # the app manifest is only embedded in the real app), so running them
      # there fails for a reason that has nothing to do with the code.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
